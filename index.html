<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rockin' V Ranch Company Gaming</title>
<meta name="description" content="Family game night score cards from Rockin' V Ranch Company Gaming.">
<meta name="theme-color" content="#0e0b09">
<link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg1:#2a211b;--bg2:#0e0b09;--gold:#b89a5e;--gold2:#e0c27c;--ink:#f1e8d3;--muted:#a89b82;--panel:#18130f;--line:#4a3b25}
*{box-sizing:border-box}
html{margin:0;background:#0e0b09}body{margin:0}
body{min-height:100vh;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:radial-gradient(ellipse at 50% 12%,var(--bg1) 0%,var(--bg2) 70%) no-repeat,#0e0b09;padding:28px 16px calc(28px + env(safe-area-inset-bottom))}
main{width:min(520px,100%);margin:0 auto;text-align:center}
.logo{width:min(78vw,340px);height:auto;filter:drop-shadow(0 10px 26px rgba(0,0,0,.6))}
h1{margin:6px 0 4px;font:700 clamp(15px,4.4vw,19px)/1.2 Georgia,'Times New Roman',serif;letter-spacing:.3em;text-transform:uppercase;color:var(--gold2)}
.tag{margin:0 0 22px;color:var(--muted);font-size:16px;line-height:1.4}
.rule{display:flex;align-items:center;gap:12px;margin:0 0 18px;color:var(--gold);font:600 12px/1 Georgia,serif;letter-spacing:.34em;text-transform:uppercase}
.rule:before,.rule:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.card{display:flex;gap:14px;align-items:center;text-align:left;background:linear-gradient(160deg,#211a14,var(--panel));border:1px solid var(--line);border-radius:18px;padding:14px;margin:0 0 14px;box-shadow:0 8px 20px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05)}
.emb{flex:none;width:76px;height:76px;border-radius:16px;display:grid;place-items:center;background:#0e0b09;border:1px solid var(--gold);box-shadow:inset 0 0 0 3px #0e0b09,inset 0 0 0 4px rgba(184,154,94,.5)}
.bars{display:grid;gap:4px;width:48px}.bars i{display:block;height:9px;border-radius:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.info{flex:1;min-width:0}
.info h2{margin:0 0 2px;font:700 22px/1.15 Georgia,'Times New Roman',serif;color:var(--ink)}
.info p{margin:0 0 10px;color:var(--muted);font-size:14.5px;line-height:1.35}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.b{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:22px;font:800 15px/1 system-ui,sans-serif;text-decoration:none;letter-spacing:.02em}
.b.p{background:linear-gradient(150deg,#e0c27c,#b08a3e);color:#1b140c;box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5)}
.b.s{border:1px solid var(--gold);color:var(--gold2)}
.soon{opacity:.85}.soon .tagsoon{display:inline-block;margin:0 0 10px;padding:6px 12px;border:1px dashed var(--gold);border-radius:14px;color:var(--gold2);font:700 12px/1 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase}
.foot{margin-top:26px;color:#7d7058;font:600 11px/1.6 Georgia,serif;letter-spacing:.22em;text-transform:uppercase}
.b:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
</style></head><body><main>
<img class="logo" src="logo.png" alt="Rockin' V Ranch Company Gaming">
<h1>Family Game Night</h1>
<p class="tag">Score cards you can install on your phone. Keep the pencil in the drawer.</p>

  <div class="info"><h2>Qwixx</h2><p>Four color rows and a few bonuses.</p>

  <div class="info"><h2>Yahtzee</h2><p>Official, family or simple rules, joker options and rolling dice.</p>
    <div class="btns"><a class="b p" href="yahtzee/play.html">Play</a><a class="b s" href="yahtzee/">Install</a></div></div>
</section>

<div class="foot">Rockin' V Ranch Company Gaming</div>
</main></body></html>
